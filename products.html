<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منتجات عرابي للعطور - Orabi Perfumes Products</title>
    <!-- أيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --text-light: #ffffff;
            --text-muted: #d1d1d1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* خلفية سوداء وذهبية تموجية ومتحركة بشكل انسيابي فاخر */
        body {
            min-height: 100vh;
            color: var(--text-light);
            background: linear-gradient(-45deg, #000000, #1a1505, #0b0b0b, #2a2008, #111111);
            background-size: 400% 400%;
            animation: gradientWave 12s ease infinite;
            padding: 2rem 0 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes gradientWave {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* الهيدر والعنوان الرئيسي */
        header {
            text-align: center;
            margin-bottom: 2.5rem;
            padding: 0 1rem;
        }

        header h1 {
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        header p {
            color: var(--gold-light);
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        /* حاوي قائمة الصور بشكل طولي */
        .products-list {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
            width: 100%;
            max-width: 650px;
            padding: 0 1rem;
        }

        /* كارت الصورة المتناسق */
        .product-item {
            background: rgba(22, 22, 22, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 20px;
            padding: 1.2rem;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            transition: transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .product-item:hover {
            transform: translateY(-5px);
            border-color: var(--gold-primary);
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.25);
        }

        /* ضبط مقاس الصور لتكون متناسقة ومتناسبة */
        .product-item img {
            width: 100%;
            max-height: 600px;
            object-fit: contain;
            border-radius: 12px;
        }

        /* زر العودة للصفحة الرئيسية */
        .btn-back {
            margin-top: 3rem;
            margin-bottom: 3rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 0.8rem 2rem;
            border-radius: 30px;
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728);
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
            cursor: pointer;
        }

        .btn-back:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.7);
        }

        /* الأيقونات الثابتة العائمة على جانب الصفحة */
        .floating-contact-container {
            position: fixed;
            bottom: 30px;
            right: 25px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            z-index: 9999;
        }

        .floating-btn {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 1.7rem;
            text-decoration: none;
            position: relative;
            transition: transform 0.3s ease;
        }

        /* أيقونة الواتساب - اللون الأخضر */
        .btn-whatsapp-float {
            background-color: #25d366;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.5);
            animation: pulseGreen 2s infinite;
        }

        /* أيقونة الهاتف - اللون الذهبي */
        .btn-phone-float {
            background: linear-gradient(135deg, #bf953f, #d4af37, #aa771c);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.5);
            animation: pulseGold 2s infinite 0.5s;
        }

        .floating-btn:hover {
            transform: scale(1.12);
        }

        /* تأثير موجات التموج للواتساب */
        @keyframes pulseGreen {
            0% {
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7);
            }
            70% {
                box-shadow: 0 0 0 18px rgba(37, 211, 102, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
            }
        }

        /* تأثير موجات التموج للهاتف */
        @keyframes pulseGold {
            0% {
                box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.8);
            }
            70% {
                box-shadow: 0 0 0 18px rgba(212, 175, 55, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(212, 175, 55, 0);
            }
        }

        /* تنسيقات الفوتر والقيد السفلي */
        footer {
            width: 100%;
            background-color: rgba(5, 5, 5, 0.95);
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            padding: 1.8rem 1rem;
            text-align: center;
            color: #a0a0a0;
            font-size: 0.95rem;
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        footer p {
            margin: 0;
            color: #d1d1d1;
        }

        .footer-credits {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .footer-credits span {
            font-size: 0.85rem;
            color: #f3e5ab;
        }

        .footer-credits img {
            height: 28px;
            width: auto;
            object-fit: contain;
            vertical-align: middle;
        }

        .footer-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            color: #fff;
            text-decoration: none;
            font-size: 0.85rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .footer-btn.phone-btn {
            background: linear-gradient(135deg, #bf953f, #d4af37);
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        }

        .footer-btn.whatsapp-btn {
            background-color: #25d366;
            box-shadow: 0 0 8px rgba(37, 211, 102, 0.4);
        }

        .footer-btn:hover {
            transform: scale(1.15);
        }

        /* الاستجابة للشاشات الصغيرة */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2.1rem;
            }
            .products-list {
                max-width: 95%;
            }
            .product-item img {
                max-height: 450px;
            }
            .floating-contact-container {
                bottom: 20px;
                right: 15px;
            }
            .floating-btn {
                width: 50px;
                height: 50px;
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header>
        <h1>عرابي للعطور</h1>
        <p>تشكيلة المنتجات الفاخرة</p>
    </header>

    <!-- قائمة الصور الطولية من 11.png إلى 15.png -->
    <main class="products-list">
        
        <div class="product-item">
            <img src="11.png" alt="منتج عرابي للعطور 11">
        </div>

        <div class="product-item">
            <img src="12.png" alt="منتج عرابي للعطور 12">
        </div>

        <div class="product-item">
            <img src="13.png" alt="منتج عرابي للعطور 13">
        </div>

        <div class="product-item">
            <img src="14.png" alt="منتج عرابي للعطور 14">
        </div>

        <div class="product-item">
            <img src="15.png" alt="منتج عرابي للعطور 15">
        </div>

    </main>

    <!-- زر الرجوع للرئيسية index.html -->
    <a href="index.html" class="btn-back">
        <i class="fas fa-arrow-right"></i>
        الرجوع للرئيسية
    </a>

    <!-- الأيقونات الثابتة العائمة مع التموج واختلاف الألوان -->
    <div class="floating-contact-container">
        <!-- زر الواتساب (أخضر مع تموج) -->
        <a href="https://wa.me/201035234373" target="_blank" class="floating-btn btn-whatsapp-float" title="تواصل عبر الواتساب">
            <i class="fab fa-whatsapp"></i>
        </a>
        <!-- زر الاتصال (ذهبي مع تموج) -->
        <a href="tel:01035234373" class="floating-btn btn-phone-float" title="اتصل بنا">
            <i class="fas fa-phone"></i>
        </a>
    </div>

    <!-- الفوتر المعدل -->
    <footer>
        <p>&copy; جميع الحقوق محفوظة - عرابي للعطور</p>
        <div class="footer-credits">
            <span>تصميم بواسطة</span>
            <img src="100.png" alt="شعار التصميم">
            <a href="tel:01010255123" class="footer-btn phone-btn" title="اتصال هاتفي"><i class="fa-solid fa-phone"></i></a>
            <a href="https://wa.me/201010255123" target="_blank" class="footer-btn whatsapp-btn" title="مراسلة عبر الواتساب"><i class="fa-brands fa-whatsapp"></i></a>
        </div>
    </footer>

</body>
</html>
